<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account Login</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="login-container">
      <div class="login-card">
        <header class="login-header">
          <div class="brand-logo" aria-hidden="true">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </div>
          <h1>Welcome Back</h1>
          <p class="subtitle">Please enter your details to sign in to your account.</p>
        </header>

        <form id="login-form" novalidate aria-labelledby="form-title">
          <div id="status-message" class="status-message" role="alert" aria-live="assertive"></div>

          <div class="form-group">
            <label for="identifier">Email or Username</label>
            <div class="input-wrapper">
              <input
                type="text"
                id="identifier"
                name="identifier"
                placeholder="name@example.com or username"
                autocomplete="username"
                required
                aria-required="true"
                aria-describedby="identifier-error"
              />
            </div>
            <span id="identifier-error" class="error-message" aria-live="polite"></span>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <div class="input-wrapper password-wrapper">
              <input
                type="password"
                id="password"
                name="password"
                placeholder="••••••••"
                autocomplete="current-password"
                required
                aria-required="true"
                aria-describedby="password-error"
              />
              <button
                type="button"
                id="toggle-password"
                class="toggle-password-btn"
                aria-label="Show password"
                title="Show password"
              >
                <svg class="eye-icon eye-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg class="eye-icon eye-closed hidden" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
            <span id="password-error" class="error-message" aria-live="polite"></span>
          </div>

          <div class="form-options">
            <label class="remember-me">
              <input type="checkbox" id="remember-me" name="rememberMe" />
              <span>Remember me</span>
            </label>
            <a href="#forgot-password" id="forgot-password-link" class="forgot-password-link">Forgot password?</a>
          </div>

          <button type="submit" id="submit-btn" class="submit-btn">
            <span class="btn-text">Sign In</span>
            <span class="spinner hidden" aria-hidden="true"></span>
          </button>
        </form>
      </div>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
